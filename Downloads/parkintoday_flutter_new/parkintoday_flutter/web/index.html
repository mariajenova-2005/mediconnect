<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ParkInToday - Smart Parking App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ParkInToday">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ParkInToday</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0A1628;
    }
    /* Center the app on wide screens like a phone */
    #flutter_target {
      max-width: 430px;
      margin: 0 auto;
      height: 100vh;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0,180,216,0.15);
    }
  </style>
</head>
<body>
  <div id="flutter_target"></div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            hostElement: document.querySelector("#flutter_target"),
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <script src="flutter.js" defer></script>
</body>
</html>
